# Throwaway diagnostic: answers the open questions about the arm64 macOS runners before we
# commit to a macOS CI leg. Delete once it has told us what we need.
#
#   1. Is HVF usable, or is the runner itself a VM without nested virt?
#   2. Does UTM install and actually run? It is a GUI .app, and it is the only route to a
#      GL-capable QEMU that developers can realistically install (the virgl brew tap is a
#      30-60 min source build on macOS 26, so it is out).
#   3. Can we record the screen at all, or does TCC block it?
#
# Every step is continue-on-error so that one failure still leaves the rest of the diagnosis.
name: Probe macOS runner

on:
  workflow_dispatch:

jobs:
  probe:
    name: Probe ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15 = macOS 15 arm64, macos-26 = macOS 26 arm64 (also macos-latest, and what
        # the dev machine runs). Both are Apple Silicon.
        runner: [macos-15, macos-26]

    steps:
      - name: Runner facts
        continue-on-error: true
        run: |
          echo "arch:         $(uname -m)"
          sw_vers
          echo "hv_support:   $(sysctl -n kern.hv_support 2>&1)"
          echo "session type: $(launchctl managername 2>&1)"
          echo "console user: $(stat -f%Su /dev/console 2>&1)"
          echo "displays:"; system_profiler SPDisplaysDataType 2>&1 | head -15

      - name: Install stock QEMU (bottle, for the HVF check only)
        continue-on-error: true
        run: |
          start=$(date +%s)
          brew install qemu
          echo "elapsed: $(( $(date +%s) - start ))s"
          qemu-system-aarch64 --version | head -1

      # NB: macOS has no `timeout` (that is GNU coreutils' gtimeout), so this backgrounds QEMU
      # and checks whether it is still alive, rather than relying on a timeout exit code.
      - name: Is HVF usable?
        continue-on-error: true
        run: |
          set +e
          qemu-system-aarch64 -machine virt -accel hvf -cpu host \
            -m 256 -display none -S > /tmp/hvf.log 2>&1 &
          pid=$!
          sleep 6
          if kill -0 "$pid" 2>/dev/null; then
            echo "RESULT: HVF works (QEMU still running after 6s)"
            kill "$pid" 2>/dev/null
          else
            wait "$pid"; rc=$?
            echo "--- QEMU output:"; cat /tmp/hvf.log
            echo "RESULT: HVF unavailable (rc=$rc) -- an arm64 guest would fall back to TCG"
          fi

      - name: Does UTM install?
        id: utm-install
        continue-on-error: true
        run: |
          start=$(date +%s)
          brew install --cask utm 2>&1 | tail -5
          echo "elapsed: $(( $(date +%s) - start ))s"
          ls -ld /Applications/UTM.app
          /Applications/UTM.app/Contents/MacOS/utmctl --help 2>&1 | head -5

      - name: Does UTM actually run?
        continue-on-error: true
        run: |
          set +e
          utmctl=/Applications/UTM.app/Contents/MacOS/utmctl
          test -x "$utmctl" || { echo "RESULT: UTM not installed, skipping"; exit 0; }

          open -a UTM
          sleep 25
          echo "--- processes:"; pgrep -fl 'UTM' | head -5

          echo "--- utmctl list:"
          "$utmctl" list 2>&1 | head -10; rc=$?
          if [ $rc -eq 0 ]; then
            echo "RESULT: UTM runs and utmctl responds -- the macOS leg can use UTM"
          else
            echo "RESULT: utmctl failed (rc=$rc) -- UTM likely cannot run headless here"
          fi

      - name: Can we record the screen?
        continue-on-error: true
        run: |
          brew install ffmpeg 2>&1 | tail -2
          set +e

          # Both of these self-limit (-V seconds / -t seconds), so no `timeout` is needed.
          echo "=== screencapture (5s) ==="
          screencapture -v -V 5 /tmp/screencapture.mov 2>&1
          echo "rc=$?"; ls -l /tmp/screencapture.mov 2>&1

          echo "=== ffmpeg avfoundation: device list ==="
          ffmpeg -hide_banner -f avfoundation -list_devices true -i "" 2>&1 | head -20

          # The screen is video device index 0 on this runner ("[0] Capture screen 0").
          echo "=== ffmpeg avfoundation: 5s capture ==="
          ffmpeg -hide_banner -y -f avfoundation -framerate 10 -i "0:none" \
            -t 5 /tmp/ffmpeg.mov 2>&1 | tail -15
          echo "rc=$?"; ls -l /tmp/ffmpeg.mov 2>&1

          echo "=== verdict ==="
          for f in /tmp/screencapture.mov /tmp/ffmpeg.mov; do
            if [ -s "$f" ]; then echo "$f: $(stat -f%z "$f") bytes -- CAPTURED"
            else echo "$f: empty or missing -- BLOCKED"; fi
          done

      - name: Upload whatever was captured
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: macos-probe-${{ matrix.runner }}
          path: |
            /tmp/screencapture.mov
            /tmp/ffmpeg.mov
          if-no-files-found: warn
